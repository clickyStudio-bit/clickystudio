<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Clicky Studio — Gantungan Kunci Custom 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --pink:#EA4C75; --coral:#EF7853; --yellow:#FCC261; --lime:#DDD354;
  --cream:#FFF8EE; --paper:#FFFFFF; --ink:#3B2430; --muted:#8A6B78; --line:#F1E3D8;
  --shadow:0 10px 30px rgba(234,76,117,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.5;min-height:100vh}
h1,h2,h3,h4,.brand,.btn{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.tiny{font-size:13px;color:var(--muted)}
.pill{display:inline-block;background:#fff;color:var(--pink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}
.grad{background:linear-gradient(90deg,var(--pink),var(--coral),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}

/* buttons */
.btn{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:13px 24px;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(234,76,117,.3)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.alt{background:var(--yellow);color:var(--ink);box-shadow:0 6px 16px rgba(252,194,97,.4)}
.btn.ghost{background:#fff;color:var(--pink);box-shadow:inset 0 0 0 2px var(--pink)}
.btn.dark{background:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px;box-shadow:none}
.btn.block{width:100%}
.heart{border:0;background:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;color:#cbb;font-size:18px;box-shadow:var(--shadow)}
.heart.on{color:var(--pink)}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,248,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav-in{display:flex;align-items:center;gap:18px;height:68px}
.brand{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink)}
.brand b{color:var(--pink)}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--coral));color:#fff;display:grid;place-items:center;font-size:20px}
.menu{display:flex;gap:4px;margin-left:auto;align-items:center}
.menu a{padding:8px 12px;border-radius:999px;font-weight:700;font-size:15px}
.menu a:hover,.menu a.act{background:#fff;color:var(--pink);box-shadow:var(--shadow)}
.nav-r{display:flex;gap:10px;align-items:center}
.cart{position:relative;font-size:20px;padding:6px 10px}
.cart span{position:absolute;top:-4px;right:-2px;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:800;padding:0 4px}
.burger{display:none;border:0;background:#fff;border-radius:12px;padding:8px 12px;font-size:18px;cursor:pointer;margin-left:auto}

/* promo + sections */
.promo{background:var(--pink);color:#fff;text-align:center;padding:8px;font-weight:800;font-size:14px}
section{padding:34px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}
.sec-h h2{font-size:30px}
.arrows button{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:22px;cursor:pointer;color:var(--pink)}
.page-h{padding:40px 0 10px}
.page-h h1{font-size:44px}
.page-h p{color:var(--muted);max-width:620px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:40px;padding-bottom:20px}
.hero h1{font-size:64px;margin:16px 0}
.hero p{font-size:18px;color:#6e4f5c;max-width:520px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hero-art{position:relative;height:340px;display:flex;align-items:center;justify-content:center}
.hk{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;color:#fff;font-family:"Baloo 2";font-weight:800;font-size:40px;margin:-4px;box-shadow:0 8px 0 rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.08);animation:bob 4s ease-in-out infinite}
.hk:nth-child(2){animation-delay:.3s}.hk:nth-child(3){animation-delay:.6s}.hk:nth-child(4){animation-delay:.9s}.hk:nth-child(5){animation-delay:1.2s}
.hero-rail{display:flex;flex-direction:column;align-items:center;gap:0;transform:rotate(-8deg)}
.hero-rail .plate{background:#fff;border-radius:26px;padding:16px 14px;display:flex;gap:8px;box-shadow:var(--shadow)}
.hero-rail .ring{width:58px;height:58px;border-radius:50%;border:9px solid #FFE3CF;margin-bottom:-22px;z-index:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* slider */
.slider{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 18px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 240px;scroll-snap-align:start;background:#fff;border-radius:var(--r);padding:12px;box-shadow:var(--shadow);transition:transform .2s}
.slide:hover{transform:translateY(-4px)}
.simg{height:190px;border-radius:16px;display:grid;place-items:center;font-size:84px}
.slide small{color:var(--muted);font-weight:700;display:block;margin-top:10px}
.slide b{display:block;font-family:"Baloo 2";font-size:19px}
.slide span{color:var(--pink);font-weight:800}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.pcard{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pimg{height:200px;display:grid;place-items:center;font-size:90px;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:12px;top:12px;background:#fff;color:var(--pink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{font-size:20px}
.price{color:var(--pink);font-weight:800;font-size:18px}
.row{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cat{border-radius:var(--r);padding:26px;color:var(--ink);min-height:230px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .2s}
.cat:hover{transform:translateY(-4px)}
.cat h3{font-size:28px}
.cat p{margin:6px 0 0;font-size:15px}
.cat .big{font-size:86px;align-self:flex-end}
.band{background:#fff;border-radius:28px;margin:0 18px;padding:34px 26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step-c{background:var(--cream);border-radius:20px;padding:20px}
.step-c b{font-family:"Baloo 2";font-size:40px;color:var(--pink);line-height:1}

/* customizer */
.cz{padding-top:24px}
.cz-head h1{font-size:44px;margin:12px 0 6px}
.cz-head p{color:var(--muted);margin:0 0 18px}
.cz-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
.cz-stage{background:linear-gradient(160deg,#fff,#FFF0E4);border-radius:28px;padding:14px;box-shadow:var(--shadow);position:sticky;top:90px}
.stage{height:440px;border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 35%,#fff,#FFE9D8 70%)}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage-hint{position:absolute;inset:auto 0 22px 0;text-align:center;font-weight:800;color:var(--muted);pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;justify-content:center}
.cz-panel{background:#fff;border-radius:28px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.step h3{font-size:19px;margin-bottom:10px}
.step h4{font-size:15px;margin:12px 0 8px;color:var(--muted)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line),0 4px 10px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.seg{display:inline-flex;background:var(--cream);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--pink);color:#fff}
.wordrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wordrow input{flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:"Baloo 2";font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;outline:none}
.wordrow input:focus{border-color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{display:flex;align-items:center;gap:2px;background:var(--cream);border-radius:14px;padding:4px}
.chip button{border:0;background:transparent;cursor:pointer;font-weight:800;padding:4px 6px;border-radius:8px;color:var(--ink)}
.chip button:disabled{opacity:.3}
.chip .chb{width:44px;height:44px;border-radius:12px;padding:0;display:grid;place-items:center;background:var(--yellow)}
.chip .chb span,.chip .chb i{font-family:"Baloo 2";font-weight:800;font-size:24px;font-style:normal}
.summary{background:var(--cream);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow.total{font-size:20px;border-top:2px dashed #EBD6C6;padding-top:10px}
.srow.total b{color:var(--pink);font-family:"Baloo 2";font-size:26px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:#fff;font-weight:800;cursor:pointer;box-shadow:var(--shadow);font-size:18px}
textarea,input,select{border:2px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;outline:none;width:100%}
textarea:focus,input:focus,select:focus{border-color:var(--pink)}
textarea{min-height:70px;resize:vertical}

/* cart / checkout / forms */
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start;padding-top:20px}
.panel{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.thumb{width:84px;height:84px;border-radius:18px;display:grid;place-items:center;font-size:44px;flex:0 0 84px;background:var(--cream);overflow:hidden}
.mini{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:84px}
.mini span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.mini i{font-style:normal;font-family:"Baloo 2";font-size:12px;font-weight:800}
.item .info{flex:1;min-width:0}
.item .info b{font-family:"Baloo 2";font-size:18px;display:block}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.form .full{grid-column:1/-1}
.err{background:#FFE5EC;color:#B0264F;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;display:none}
.err.show{display:block}
.radio{display:flex;gap:10px;flex-wrap:wrap}
.radio label{flex:1;min-width:150px;border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:800}
.radio label:has(input:checked){border-color:var(--pink);background:#FFF0F4}
.radio input{width:auto}
.qris{background:var(--cream);border-radius:18px;padding:16px;text-align:center}
.qris .qbox{width:180px;height:180px;margin:0 auto 10px;background:#fff;border:2px dashed #E9C7B6;border-radius:16px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.qris .qbox img{width:100%;height:100%;object-fit:contain}
.status{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--yellow);font-weight:800;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv b{color:var(--muted);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{border:0;background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.tabs button.on{background:var(--pink);color:#fff}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{font-size:60px;display:block}
.reviews .rv{border-bottom:1px solid var(--line);padding:10px 0}
details{background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:800;font-family:"Baloo 2";font-size:18px}

/* product detail */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:30px;align-items:start}
.pd .big{height:420px;border-radius:28px;display:grid;place-items:center;font-size:160px;overflow:hidden}
.pd .big img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:40px;margin:8px 0}
.pd .price{font-size:30px}

/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;gap:20px;padding-top:24px;align-items:start}
.adm aside{background:#fff;border-radius:var(--r);padding:12px;box-shadow:var(--shadow);position:sticky;top:90px;display:flex;flex-direction:column;gap:4px}
.adm aside a{padding:10px 14px;border-radius:14px;font-weight:800}
.adm aside a.on,.adm aside a:hover{background:var(--cream);color:var(--pink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:"Baloo 2";font-size:26px;color:var(--ink)}
.kpi.p b{color:var(--pink)}
.chart{display:flex;align-items:flex-end;gap:12px;height:220px;padding:12px 4px 0;border-bottom:2px solid var(--line)}
.bar-g{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars{display:flex;gap:4px;align-items:flex-end;height:180px;width:100%;justify-content:center}
.bars div{width:40%;max-width:30px;border-radius:8px 8px 0 0;min-height:2px}
.bars .i{background:var(--pink)}
.bars .e{background:var(--yellow)}
.bar-g small{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tablebox{overflow-x:auto}
.inl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inl select,.inl input{width:auto;padding:7px 10px;border-radius:12px;font-size:13px}
.del{color:#c0394f;font-weight:800;background:none;border:0;cursor:pointer}
.neg{color:#c0394f}

/* misc */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;transition:transform .35s;z-index:99;max-width:90vw;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.2)}
#toast.show{transform:translate(-50%,0)}
.fade{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{background:var(--ink);color:#fbe7ee;margin-top:50px;padding:34px 0 90px}
footer a{opacity:.85}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer b{font-family:"Baloo 2";font-size:22px;color:#fff}

@media (max-width:980px){
  .menu{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:#fff;padding:10px;border-bottom:1px solid var(--line);align-items:stretch}
  .menu.open{display:flex}
  .burger{display:block}
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:46px}
  .cz-grid,.two,.pd{grid-template-columns:1fr}
  .cz-stage{position:relative;top:0}
  .cats,.steps{grid-template-columns:1fr}
  .adm{grid-template-columns:1fr}
  .adm aside{position:relative;top:0;flex-direction:row;flex-wrap:wrap}
  .band{margin:0 10px}
}
@media (max-width:560px){
  .form{grid-template-columns:1fr}
  .page-h h1{font-size:34px}
  .cz-head h1{font-size:32px}
  .stage{height:340px}
  .pd .big{height:300px;font-size:110px}
  .nav-r .btn{display:none}
}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a href="#home" class="brand"><span class="logo">✿</span>Clicky<b>Studio</b></a>
    <nav class="menu" id="menu">
      <a href="#home" data-nav="home">Home</a>
      <a href="#shop" data-nav="shop">Shop</a>
      <a href="#clicker" data-nav="clicker">Custom Your Keychain</a>
      <a href="#how" data-nav="how">How to Order</a>
      <a href="#about" data-nav="about">About Us</a>
      <a href="#faq" data-nav="faq">FAQ</a>
    </nav>
    <div class="nav-r">
      <a href="#cart" class="cart" aria-label="Keranjang">🛒<span id="cartN">0</span></a>
      <a href="#account" class="btn sm" id="loginBtn">Login / Register</a>
      <button class="burger" data-act="menu" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div><b>Clicky Studio</b><p class="tiny" style="color:#fbe7ee;opacity:.8">Gantungan kunci 3D handmade, dibuat khusus untukmu.</p></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:start">
      <a href="#shop">Shop</a><a href="#custom">Custom Request</a><a href="#track">Track Order</a><a href="#faq">FAQ</a><a href="#admin">Admin</a>
    </div>
  </div>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONFIG ============ */
const BRAND = 'Clicky Studio';
const ADMIN_PIN = 'admin123'; // DEMO ONLY. Ganti dengan Supabase Auth sebelum live.
const COLORS = [
  {n:'Biru',h:'#5AA9E6'},{n:'Cream',h:'#FFF1D6'},{n:'Kuning',h:'#FFD23F'},
  {n:'Merah',h:'#E63946'},{n:'Pink',h:'#F79BD3'},{n:'Hijau',h:'#7ED9A0'},
  {n:'Abu-abu',h:'#A9A9B3'},{n:'Cokelat',h:'#8B5E3C'},{n:'Coral',h:'#FF7F6B'}
];
const CATS = {custom:'Custom Keychain', '3d':'3D Keychain', clicker:'Clicker Keychain 3D'};
const ORDER_STATUS = ['Menunggu konfirmasi','Menunggu pembayaran','Pembayaran berhasil','Sedang diproduksi','Siap dikirim / diambil','Selesai','Dibatalkan'];
const PAY_STATUS = ['COD','Menunggu verifikasi','Berhasil','Ditolak'];
const CUSTOM_STATUS = ['Menunggu penawaran','Penawaran dikirim','Disetujui','Ditolak','Masuk keranjang'];
const TX_CAT = {
  masuk:['COD','QRIS','Lainnya'],
  keluar:['Filament 3D printing','Bahan baku','Komponen gantungan','Biaya listrik','Biaya desain','Lainnya']
};
const DEFAULT_SETTINGS = {wa:'6281234567890', maxLetters:6, qris:'', sheetsUrl:'', promo:'Gratis ongkir min. belanja Rp100.000 🎉'};
const SEED = [

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const maxL = ()=>Math.max(1, Math.min(12, +S.settings.maxLetters||6));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600); }
function fileURL(f){
  return new Promise(res=>{
    if(!f || !f.size) return res(null);
    if(f.size>1.5e6){ toast('File terlalu besar (maks 1.5 MB)'); return res(null); }
    const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(f);
  });
}
function rr(w,h,r){
  const s=new THREE.Shape(); const x=-w/2,y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}
function slab(w,h,r,depth,color,x,y,z){
  const g=new THREE.ExtrudeGeometry(rr(w,h,r),{depth,bevelEnabled:true,bevelThickness:.04,bevelSize:.04,bevelSegments:3,curveSegments:8});
  const m=new THREE.MeshPhongMaterial({color:new THREE.Color(color),shininess:70,specular:0x444444});
  const mesh=new THREE.Mesh(g,m); mesh.position.set(x,y,z); return mesh;
}
function letterTex(ch,color){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d'); x.font='800 190px "Baloo 2","Arial Rounded MT Bold",Arial,sans-serif';
  x.textAlign='center'; x.textBaseline='middle'; x.fillStyle=color; x.fillText(ch,128,136);
  return new THREE.CanvasTexture(c);
}

function initClicker(root){
  const ed = editUid && S.cart.find(i=>i.uid===editUid);
  const st = ed
    ? {base:ed.clicker.base, keys:[...ed.clicker.keys], word:ed.clicker.word, lcolor:ed.clicker.lcolor, defKey:2, sel:0, mode:'semua', qty:ed.qty, note:ed.note||''}
    : {base:0, keys:[2,2,2,2], word:'LUNA', lcolor:3, defKey:2, sel:0, mode:'semua', qty:1, note:''};
  const view={rx:-.15, ry:0, zoom:1, auto:true};

  const swHTML = kind => COLORS.map((c,i)=>`<button class="sw" data-ck="${kind}" data-v="${i}" title="${c.n}" aria-label="${c.n}" style="background:${c.h}"></button>`).join('');
  $$('[data-sw]',root).forEach(el=>el.innerHTML=swHTML(el.dataset.sw));
  $('#max',root).textContent = maxL();
  const wi=$('#word',root); wi.value=st.word;
  wi.maxLength = maxL();

  const stage=$('#stage',root);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(32,1,.1,100);
  scene.add(new THREE.HemisphereLight(0xffffff,0xffe6d0,.95));
  const key=new THREE.DirectionalLight(0xffffff,.85); key.position.set(3,4,6); scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,.35); fill.position.set(-4,-2,4); scene.add(fill);
  const group=new THREE.Group(); scene.add(group);
  const cv=renderer.domElement; cv.style.touchAction='none';

  const ro=new ResizeObserver(()=>{
    const w=stage.clientWidth||400, h=stage.clientHeight||440;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  });
  ro.observe(stage);

  three={renderer,scene,camera,group,ro,raf:0,baseZ:7};

  function sync(){
    const n=st.word.length;
    while(st.keys.length<n) st.keys.push(st.defKey);
    st.keys.length=n;
    st.sel=Math.max(0,Math.min(st.sel,Math.max(0,n-1)));
  }
  function build(){
    while(group.children.length){
      const c=group.children[0]; group.remove(c);
      c.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material){ if(o.material.map)o.material.map.dispose(); o.material.dispose(); } });
    }
    const n=st.word.length, L=Math.max(n,1), pitch=.66, len=L*pitch+.42;
    group.add(slab(len,1.5,.38,.34,COLORS[st.base].h,0,0,0));
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.2,.055,14,36),new THREE.MeshPhongMaterial({color:0xFFF1D6,shininess:40}));
    ring.position.set(-len/2+.38,.98,.18); group.add(ring);
    const x0=-(n-1)*pitch/2;
    for(let i=0;i<n;i++){
      const x=x0+i*pitch;
      const cap=slab(.54,.54,.13,.3,COLORS[st.keys[i]].h,x,0,.36);
      cap.userData.key=i;
      if(st.mode==='tombol' && i===st.sel) cap.material.emissive.setHex(0x3a1a26);
      group.add(cap);
      const lt=new THREE.Mesh(new THREE.PlaneGeometry(.44,.44),new THREE.MeshBasicMaterial({map:letterTex(st.word[i],COLORS[st.lcolor].h),transparent:true,depthWrite:false}));
      lt.position.set(x,0,.73); group.add(lt);
    }
    three.baseZ=Math.max(6,len*1.25+3);
    $('#hint',root).style.display = n? 'none':'block';
  }
  function paint(){
    const n=st.word.length, price=clickerPrice(n);
    $$('[data-ck="base"]',root).forEach(b=>b.classList.toggle('on',+b.dataset.v===st.base));
    const keyActive = st.mode==='tombol' ? (n?st.keys[st.sel]:-1) : (st.keys.every(k=>k===st.keys[0])&&n?st.keys[0]:-1);
    $$('[data-ck="key"]',root).forEach(b=>b.classList.toggle('on',+b.dataset.v===keyActive));
    $$('[data-ck="lcolor"]',root).forEach(b=>b.classList.toggle('on',+b.dataset.v===st.lcolor));
    $$('[data-ck="mode"]',root).forEach(b=>b.classList.toggle('on',b.dataset.v===st.mode));
    $('#chips',root).innerHTML = n
      ? st.word.split('').map((ch,i)=>`<div class="chip"><button class="chb ${i===st.sel?'':''}" data-ck="sel" data-v="${i}" style="background:${COLORS[st.keys[i]].h};${i===st.sel?'outline:3px solid var(--pink)':''}"><i style="color:${COLORS[st.lcolor].h}">${esc(ch)}</i></button><button data-ck="left" data-v="${i}" ${i===0?'disabled':''} aria-label="Geser kiri">‹</button><button data-ck="right" data-v="${i}" ${i===n-1?'disabled':''} aria-label="Geser kanan">›</button><button data-ck="del" data-v="${i}" aria-label="Hapus">×</button></div>`).join('')
      : '<p class="tiny">Belum ada huruf. Ketik namamu di atas.</p>';
    $('#cnt',root).textContent = `${n} / ${maxL()} huruf`;
    $('#sN',root).textContent = n;
    $('#sU',root).textContent = rp(price);
    $('#sQ',root).textContent = st.qty;
    $('#sT',root).textContent = rp(price*st.qty);
    $('#addCz',root).disabled = n===0;
    if(wi.value!==st.word) wi.value=st.word;
  }
  function refresh(){ sync(); build(); paint(); }

  /* 3D interaction */
  let drag=null;
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; cv.setPointerCapture(e.pointerId); view.auto=false; });
  cv.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    view.ry+=dx*.01; view.rx=Math.max(-.9,Math.min(.9,view.rx+dy*.005));
    drag.x=e.clientX; drag.y=e.clientY;
  });
  cv.addEventListener('pointerup',e=>{
    if(drag && !drag.moved){
      const r=cv.getBoundingClientRect();
      ndc.x=((e.clientX-r.left)/r.width)*2-1; ndc.y=-((e.clientY-r.top)/r.height)*2+1;
      ray.setFromCamera(ndc,camera);
      const hit=ray.intersectObjects(group.children,true).find(h=>h.object.userData.key!==undefined);
      if(hit){ st.sel=hit.object.userData.key; st.mode='tombol'; refresh(); }
    }
    drag=null;
  });

  function frame(t){
    const sway = view.auto ? Math.sin(t*.0009)*.22 : 0;
    group.rotation.set(view.rx, view.ry+sway, 0);
    camera.position.set(0,0,three.baseZ/view.zoom);
    renderer.render(scene,camera);
    three.raf=requestAnimationFrame(frame);
  }
  three.raf=requestAnimationFrame(frame);

  /* UI events */
  wi.addEventListener('input',()=>{
    const v=wi.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,maxL());
    if(v!==wi.value) wi.value=v;
    st.word=v; refresh();
  });
  root.querySelector('#note').addEventListener('input',e=>st.note=e.target.value);
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-ck]'); if(!b||!root.contains(b)) return;
    const k=b.dataset.ck, v=+b.dataset.v, n=st.word.length;
    const swap=(a,i,j)=>{[a[i],a[j]]=[a[j],a[i]];};
    switch(k){
      case 'base': st.base=v; break;
      case 'key': if(st.mode==='semua') st.keys=st.keys.map(()=>v); else if(n) st.keys[st.sel]=v; break;
      case 'lcolor': st.lcolor=v; break;
      case 'mode': st.mode=b.dataset.v; break;
      case 'sel': st.sel=v; st.mode='tombol'; break;
      case 'left': if(v>0){ const w=st.word.split(''); swap(w,v,v-1); st.word=w.join(''); swap(st.keys,v,v-1); st.sel=v-1; } break;
      case 'right': if(v<n-1){ const w=st.word.split(''); swap(w,v,v+1); st.word=w.join(''); swap(st.keys,v,v+1); st.sel=v+1; } break;
      case 'del': { const w=st.word.split(''); w.splice(v,1); st.word=w.join(''); st.keys.splice(v,1); wi.value=st.word; break; }
      case 'rl': view.ry-=.5; view.auto=false; break;
      case 'rr': view.ry+=.5; view.auto=false; break;
      case 'zi': view.zoom=Math.min(2.4,view.zoom*1.2); break;
      case 'zo': view.zoom=Math.max(.6,view.zoom/1.2); break;
      case 'reset': view.rx=-.15; view.ry=0; view.zoom=1; view.auto=true; break;
      case 'qm': st.qty=Math.max(1,st.qty-1); break;
      case 'qp': st.qty=Math.min(20,st.qty+1); break;
      case 'add': addClickerToCart(st); return;
    }
    refresh();
  });
  refresh();
}
function addClickerToCart(st){
  const n=st.word.length; if(!n){ toast('Isi huruf dulu ya'); return; }
  const item={uid:editUid||uid(),type:'clicker',name:`Clicker "${st.word}"`,qty:st.qty,unit:clickerPrice(n),note:st.note,
    clicker:{word:st.word,base:st.base,keys:[...st.keys],lcolor:st.lcolor}};
  const cart=[...S.cart];
  const idx=cart.findIndex(i=>i.uid===item.uid);
  if(idx>=0) cart[idx]=item; else cart.push(item);
  store('cart',cart); editUid=null;
  toast('Ditambahkan ke keranjang 🎉');
  location.hash='#cart';
}

  const done=S.orders.filter(o=>o.status==='Selesai');
  const incOrd=done.reduce((s,o)=>s+orderTotal(o),0);
  const incMan=S.tx.filter(t=>t.type==='masuk').reduce((s,t)=>s+(+t.amount||0),0);
  const exp=S.tx.filter(t=>t.type==='keluar').reduce((s,t)=>s+(+t.amount||0),0);
  const cod=done.filter(o=>o.payment==='COD').reduce((s,o)=>s+orderTotal(o),0)+S.tx.filter(t=>t.type==='masuk'&&t.cat==='COD').reduce((s,t)=>s+(+t.amount||0),0);
  const qris=done.filter(o=>o.payment==='QRIS').reduce((s,o)=>s+orderTotal(o),0)+S.tx.filter(t=>t.type==='masuk'&&t.cat==='QRIS').reduce((s,t)=>s+(+t.amount||0),0);
  const inc=incOrd+incMan;
  return {inc,exp,profit:inc-exp,cod,qris};
}
function series(mode){
  const N= mode==='harian'?7 : mode==='mingguan'?8 : 6;
  const now=new Date(); const out=[];
  for(let i=N-1;i>=0;i--){
    let start,end,label;
    if(mode==='harian'){ start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i); end=new Date(start.getTime()+864e5); label=start.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }
    else if(mode==='mingguan'){ start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()-7*i); end=new Date(start.getTime()+7*864e5); label=start.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }
    else { start=new Date(now.getFullYear(),now.getMonth()-i,1); end=new Date(now.getFullYear(),now.getMonth()-i+1,1); label=start.toLocaleDateString('id-ID',{month:'short'}); }
    const inR=d=>{ const t=new Date(d.length<=10?d+'T00:00':d).getTime(); return t>=start.getTime() && t<end.getTime(); };
    const inc=S.orders.filter(o=>o.status==='Selesai'&&inR(o.createdAt)).reduce((s,o)=>s+orderTotal(o),0)+S.tx.filter(t=>t.type==='masuk'&&inR(t.date)).reduce((s,t)=>s+(+t.amount||0),0);
    const exp=S.tx.filter(t=>t.type==='keluar'&&inR(t.date)).reduce((s,t)=>s+(+t.amount||0),0);
    out.push({label,inc,exp});
  }
  return out;
}

/* ============ SHEETS SYNC (via Apps Script endpoint) ============ */
function orderRow(o){
  return [o.id,fmtD(o.createdAt),o.customer.name,o.customer.wa,o.items.map(i=>`${i.qty}x ${i.name}`).join('; '),orderTotal(o),o.payment,o.paymentStatus,o.status];

async function sendSheet(sheet,id,row){
  if(!S.settings.sheetsUrl) return false;
  try{
    await fetch(S.settings.sheetsUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sheet,id,row})});
    return true;
  }catch{ return false; }
}
async function syncOrder(o){
  if(!S.settings.sheetsUrl) return;
  const ok=await sendSheet('Data Pesanan',o.id,orderRow(o));
  if(ok) store('orders',S.orders.map(x=>x.id===o.id?{...x,synced:true}:x));
}
async function syncTx(t){
  if(!S.settings.sheetsUrl) return;
  await sendSheet(t.type==='masuk'?'Data Pemasukan':'Data Pengeluaran',t.id,[t.id,t.date,t.cat,t.desc,t.amount]);
}
function exportCSV(){
  const rows=[['id','tanggal','jenis','kategori','keterangan','nominal'],...S.tx.map(t=>[t.id,t.date,t.type,t.cat,t.desc,t.amount])];
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='keuangan.csv'; a.click();
}

  prodEdit:b=>{ prodEdit=b.dataset.id; route(); },
  prodCancel:()=>{ prodEdit=null; route(); },
  prodDel:b=>{ if(!confirm('Hapus produk ini?')) return; store('products',S.products.filter(p=>p.id!==b.dataset.id)); toast('Produk dihapus'); route(); },
  txEdit:b=>{ txEdit=b.dataset.id; route(); },
  txCancel:()=>{ txEdit=null; route(); },
  txDel:b=>{ if(!confirm('Hapus transaksi ini?')) return; store('tx',S.tx.filter(t=>t.id!==b.dataset.id)); toast('Transaksi dihapus'); route(); },
  csv:exportCSV
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b) return;
  if(b.tagName==='A') e.preventDefault();
  if(A[b.dataset.act]) A[b.dataset.act](b,e);
});

/* ============ FORMS ============ */
const F = {
  adminLogin:(f,fd)=>{ if(fd.get('pin')===ADMIN_PIN){ sessionStorage.setItem('kc_admin','1'); route(); } else toast('PIN salah'); },
  login:(f,fd)=>{ store('user',{name:fd.get('name').trim(),email:fd.get('email').trim().toLowerCase()}); toast('Selamat datang, '+S.user.name+' 👋'); location.hash='#account'; route(); },
  track:(f,fd)=>{ location.hash='#track/'+fd.get('id').trim().toUpperCase(); },
  review:(f,fd)=>{
    const pid=f.dataset.pid; if(!fd.get('text').trim()) return;
    store('reviews',[...S.reviews,{pid,name:S.user?.name||'Pelanggan',rating:+fd.get('rating'),text:fd.get('text').trim()}]);
    toast('Terima kasih atas ulasanmu!'); route();
  },
  custom: async (f,fd)=>{
    const ref=await fileURL(fd.get('ref'));
    const rec={id:'CU-'+uid().toUpperCase(),createdAt:new Date().toISOString(),name:fd.get('name'),wa:fd.get('wa'),email:(fd.get('email')||'').toLowerCase(),desc:fd.get('desc'),size:fd.get('size'),note:fd.get('note')||'',ref,status:'Menunggu penawaran',price:0};
    store('custom',[rec,...S.custom]);
    toast('Permintaan terkirim! Admin akan menghubungimu.'); location.hash='#account';
  },
  checkout: async (f,fd)=>{
    const err=$('#err',f);
    const req=['name','wa','alamat','kecamatan','kota'];
    if(req.some(k=>!String(fd.get(k)||'').trim())){ err.textContent='Lengkapi semua kolom bertanda wajib.'; err.classList.add('show'); return; }
    if(!S.cart.length){ toast('Keranjang kosong'); return; }
    err.classList.remove('show');
    const pay=fd.get('pay');
    const proof=pay==='QRIS'? await fileURL(fd.get('proof')) : null;
    const total=S.cart.reduce((s,i)=>s+i.unit*i.qty,0);
    const d=new Date();
    const id='KC-'+d.toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    const email=(fd.get('email')||'').trim().toLowerCase();
    const order={id,createdAt:d.toISOString(),
      customer:{name:fd.get('name').trim(),wa:fd.get('wa').trim(),email,alamat:fd.get('alamat').trim(),kecamatan:fd.get('kecamatan').trim(),kota:fd.get('kota').trim(),catatan:(fd.get('catatan')||'').trim()},
      items:S.cart.map(i=>({...i})),total,payment:pay,
      paymentStatus: pay==='COD'?'COD':'Menunggu verifikasi',
      status:'Menunggu konfirmasi', proof, synced:false};
    store('orders',[order,...S.orders]);
    store('cart',[]);
    if(S.settings.sheetsUrl) syncOrder(order);
    toast('Pesanan berhasil dibuat ✨');
    location.hash='#confirm/'+id;
  },
  cuq:(f,fd)=>{
    const id=f.dataset.id;
    store('custom',S.custom.map(c=>c.id===id?{...c,price:+fd.get('price')||0,status:fd.get('status'),...(fd.get('status')==='Penawaran dikirim'?{}:{})}:c));
    toast('Permintaan diperbarui'); route();
  },
  product: async (f,fd)=>{
    const id=fd.get('id')||'p'+uid();
    const img=await fileURL(fd.get('img'));
    const old=S.products.find(p=>p.id===id);
    const p={id,name:fd.get('name').trim(),cat:fd.get('cat'),price:+fd.get('price')||0,stock:+fd.get('stock')||0,weight:+fd.get('weight')||0,
      emoji:fd.get('emoji')||'🔑',bg:fd.get('bg')||'#FCC261',desc:fd.get('desc')||'',
      colors:(fd.get('colors')||'').split(',').map(s=>s.trim()).filter(Boolean),
      home:!!fd.get('home'),best:!!fd.get('best'),new:!!fd.get('new'),img:img||old?.img||null};
    store('products', old? S.products.map(x=>x.id===id?p:x) : [...S.products,p]);
    prodEdit=null; toast('Produk tersimpan'); route();
  },
  tx: async (f,fd)=>{
    const id=fd.get('id')||'T'+uid();
    const t={id,date:fd.get('date'),type:fd.get('type'),cat:fd.get('cat'),desc:fd.get('desc').trim(),amount:+fd.get('amount')||0};
    store('tx', S.tx.some(x=>x.id===id)? S.tx.map(x=>x.id===id?t:x) : [...S.tx,t]);
    txEdit=null; toast('Transaksi tersimpan'); syncTx(t); route();
  },
  settings: async (f,fd)=>{
    const qris=await fileURL(fd.get('qris'));
    store('settings',{...S.settings,wa:fd.get('wa').trim(),maxLetters:Math.max(1,Math.min(12,+fd.get('maxLetters')||6)),promo:fd.get('promo'),sheetsUrl:fd.get('sheetsUrl').trim(),qris:qris||S.settings.qris});
    toast('Pengaturan disimpan'); route();
  }
};
document.addEventListener('submit',e=>{
  const f=e.target; if(!f.dataset.form) return;
  e.preventDefault();
  const fn=F[f.dataset.form]; if(fn) fn(f,new FormData(f));
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='pay'){ const box=$('#qrisBox'); if(box) box.style.display=t.value==='QRIS'?'flex':'none'; }
  if(t.dataset.ord){
    const val=t.value, id=t.dataset.id, field=t.dataset.ord;
    store('orders',S.orders.map(o=>o.id===id?{...o,[field]:val}:o));
    toast('Status diperbarui');
    const o=S.orders.find(x=>x.id===id);
    if(field==='status' && val==='Selesai') toast('Pesanan selesai dicatat sebagai pemasukan ✓');
    if(S.settings.sheetsUrl && o) syncOrder(o);
  }
});

/* ============ INIT ============ */
route();
</script>
